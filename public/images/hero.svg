<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfdcd2"/>
      <stop offset="50%" stop-color="#eae7df"/>
      <stop offset="100%" stop-color="#c2beaf"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3828"/>
      <stop offset="100%" stop-color="#1b2a1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#heroGrad)"/>
  <!-- Architectural Archway -->
  <path d="M 200 800 V 300 A 400 400 0 0 1 1000 300 V 800 Z" fill="none" stroke="#d2cebf" stroke-width="4"/>
  <!-- Minimal Chair Silhouette -->
  <rect x="480" y="450" width="240" height="180" rx="30" fill="url(#chairGrad)"/>
  <rect x="520" y="320" width="160" height="150" rx="20" fill="url(#chairGrad)"/>
  <rect x="440" y="580" width="320" height="30" rx="10" fill="#2a3828"/>
  <rect x="580" y="630" width="40" height="120" fill="#1b2a1a"/>
  <ellipse cx="600" cy="750" rx="150" ry="25" fill="#1b2a1a"/>
  <!-- Barber Pole Icon Subtle -->
  <g transform="translate(150, 180) scale(1.5)">
    <rect x="0" y="0" width="30" height="120" rx="15" fill="#ffffff" stroke="#1b2a1a" stroke-width="3"/>
    <path d="M 0 30 L 30 10 M 0 60 L 30 40 M 0 90 L 30 70 M 0 120 L 30 100" stroke="#b45309" stroke-width="6"/>
  </g>
  <text x="600" y="240" font-family="'Instrument Sans', sans-serif" font-size="32" font-weight="700" fill="#1b2a1a" text-anchor="middle" letter-spacing="6">APEX PRECISION STUDIO</text>
</svg>
